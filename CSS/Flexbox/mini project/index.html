<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: rgb(7, 44, 77);">
    
    <div id="container">
        <div id="box">
            <form>
                <h1 id="Login">Login</h1>

                <div>
                <label for="inputname" id="NAME">Username:</label>
                <input type="text" placeholder="Enter your name" id="inputname">
              </div>
                  
              <div>
                <label for="inputpassword" id="PASSWORD">Password:</label>
                <input type="password" placeholder="Enter your password" id="inputpassword">
              </div>

              <button style="width: 80%;" type="submit" >SUBMIT</button>
            </form>

        </div>
    </div>
    
</body>
</html>
