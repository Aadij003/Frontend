<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>University Registration Form</h1>
 <p>Please fill out the form below to register.</p>
 <hr>
 <h2>Personal Details</h2>

 <form>
 <label for="name">First Name:</label>
 <input type="text" name="name" id="name" placeholder="e.g. Arjun" required>

 <br><br>
 <label for="lastname">Last Name:</label>
 <input type="text" name="lastname" id="lastname" placeholder="e.g. Sharma">

  <br><br>
 <label for="dob">Date of Birth:</label>
 <input type="date" id="dob">

 <h3>Gender</h3>
 <input type="radio" name="Gender" id="male" value="male">
 <label for="male">Male</label>
    

    <br>
    <input type="radio" name="Gender" id="female" value="female">
    <label for="female">Female</label>
    
    <h3>Upload your photo</h3>
    <input type="file" name="file">
    <hr>

    <h2>Contact Information</h2>
    <label for="email">Email Address:</label>
    <input type="email" placeholder="e.g. abc@gmail.com" id="email" name="email">

    <br><br>
    <label for="number">Phone Number:</label>
    <input type="tel" placeholder="e.g. 1234567890" id="number" name="number">
 
    <br><br>
    <label for="mailingAddress">Mailing Address:</label>
    <br>
    <textarea id="mailingAddress" name="Address" placeholder="Street Address, City, State, ZIP Code"></textarea>

    <hr>
    <h2>Academic Information</h2>



    <label for="course">Select Your Course:</label>
    <select name="course" id="course">
        <option value="CSE">CSE</option>
         <option value="MECHANICAL">MECHANICAL</option>
          <option value="CIVIL">CIVIL</option>
    </select>

    <br><br>
    <label>Extracurricular Interests:</label>
    <br>
    <input type="checkbox" id="Sports" name="interest" value="Sports">
    <label for="Sports">Sports</label>
    <br>
     <input type="checkbox" id="Music & Arts" name="interest" value="Music & Arts">
     <label for="Music & Arts">Music & Arts</label>
    <br>
     <input type="checkbox" id="tech" name="interest" value="Technology Clubs">
     <label for="tech">Technology Clubs</label>
    <br>
     <input type="checkbox" id="volunteering" name="interest" value="Volunteering">
     <label for="volunteering">Volunteering</label>
    <br>

    <hr>
    <h2>Create Your Account</h2>
    <br>
    <label for="password">Create a Password:</label>
    <input type="password" id="password" name="password">
    <br><br>
    <label>Security Question:</label>
    <select name="Security Question" id="Question">
        <option value="option1">What was your first pet's name?</option>
    </select>
    <br><br>
    <label for="answer">Security Answer:</label>
    <input type="text" id="answer" name="Answer">

    <br><br>
    <input type="checkbox" name="T&C" id="tc">
    <label for="T&C">I agree to the Terms and Conditions.</label>
    <br><br>
    <hr>
    <button type="submit">Register</button>
    <button type="reset">Clear Form</button>
 </form>
</body>
</html>
