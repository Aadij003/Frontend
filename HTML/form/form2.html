<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>
    <label for="name">Name:</label>
    <input type="text" name="Name" id="name">

    <br><br>
    <label for="Age">Age:</label>
    <input type="number" name="age" id="Age" >

    <br><br>
    <label for="Password">Password:</label>
    <input type="password" name="Password" id="Password">
    
    <br><br>
    <label for="male">Male</label>
    <input type="radio" name="Gender" id="male" value="male">

    <label for="female">Female</label>
    <input type="radio" name="Gender" id="female" value="female">
    
    <br><br>
    <label for="c++">C++</label>
    <input type="checkbox" name="Subject" value="C++" id="c++">
    
     <label for="java">Java</label>
    <input type="checkbox" name="Subject" value="Java" id="java">

     <label for="javascript">JavaScript</label>
    <input type="checkbox" name="Subject" value="Javascript" id="javascript">

     <label for="Python">Python</label>
    <input type="checkbox" name="Subject" value="Python" id="Python">

    <br><br>
    <input type="submit">
    

    </form>
</body>
</html>
